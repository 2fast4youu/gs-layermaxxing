name: Gerfried public endpoint probe

on:
  push:
    branches: [gerfried-erweiterung]
    paths:
      - android/app/build.gradle.kts
      - .github/workflows/gerfried-public-endpoint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public Gerfried endpoint from outside the tailnet
        shell: python3 {0}
        run: |
          import ipaddress, json, socket, sys, time, urllib.parse, urllib.request

          BASE = "https://headless.tail586ff8.ts.net:10000/"
          ATTEMPTS, WAIT, TIMEOUT = 12, 10, 10
          host = urllib.parse.urlsplit(BASE).hostname
          port = urllib.parse.urlsplit(BASE).port

          def resolve_public():
              infos = socket.getaddrinfo(host, port, proto=socket.IPPROTO_TCP)
              ips = sorted({i[4][0] for i in infos})
              if not ips:
                  raise RuntimeError("no DNS answer")
              bad = [ip for ip in ips if not ipaddress.ip_address(ip).is_global]
              if bad:
                  raise RuntimeError(f"non-global addresses resolved, refusing: {bad}")
              return ips

          def get_json(path):
              ips = resolve_public()  # checked before every request
              url = urllib.parse.urljoin(BASE, path)
              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:  # default TLS verification
                  if resp.status != 200:
                      raise RuntimeError(f"{url}: HTTP {resp.status}")
                  return url, ips, json.loads(resp.read().decode("utf-8"))

          last = None
          for attempt in range(1, ATTEMPTS + 1):
              try:
                  h_url, h_ips, health = get_json("health")
                  # Shape of /health in server/app/main.py: {"status": "ok", "version": APP_VERSION}
                  if not isinstance(health, dict) or health.get("status") != "ok" or not isinstance(health.get("version"), str):
                      raise RuntimeError(f"unexpected health payload: {health!r}")
                  i_url, i_ips, info = get_json("api/server-info")
                  if not isinstance(info, dict) or info.get("role") != "test":
                      raise RuntimeError(f"server-info role is not 'test': {info.get('role') if isinstance(info, dict) else info!r}")
                  grid = info.get("grid_version")
                  if not isinstance(grid, int):
                      raise RuntimeError(f"server-info grid_version missing or not int: {grid!r}")
                  print(f"endpoint: {BASE}")
                  print(f"dns {host}: {', '.join(i_ips)} (all global)")
                  print(f"health {h_url}: status={health['status']} version={health['version']}")
                  print(f"server-info {i_url}: role={info['role']} version={info.get('version')} grid_version={grid}")
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  print(f"attempt {attempt}/{ATTEMPTS} failed: {type(exc).__name__}: {exc}", flush=True)
                  if attempt < ATTEMPTS:
                      time.sleep(WAIT)
          print(f"no public success after {ATTEMPTS} attempts; last error: {last}")
          sys.exit(1)
