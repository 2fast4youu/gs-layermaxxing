name: Gerfried APK

on:
  push:
    branches: [gerfried]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerfried-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend-Gate (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r server/requirements-dev.txt

      - name: pytest
        run: PYTHONPATH=server .venv/bin/pytest -q server/tests

  android:
    name: Android-Gate und APK
    needs: backend
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug-Keystore wiederherstellen und pruefen
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "Wiederhergestellt: $(stat -c%s "$HOME/.android/debug.keystore") Bytes nach $HOME/.android/debug.keystore"
          if FP="$(keytool -list -v -keystore "$HOME/.android/debug.keystore"                      -storepass android -alias androiddebugkey 2>&1                    | grep -oE 'SHA256: [0-9A-F:]+' | head -1 | cut -d' ' -f2 | tr -d ':')"              && [ -n "$FP" ]; then
            echo "Keystore lesbar, Zertifikat-Fingerprint: $FP"
            echo "EXPECTED_SIGNER=$FP" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore aus DEBUG_KEYSTORE_B64 ist mit Alias androiddebugkey / Passwort android NICHT lesbar - Gradle wird ihn ersetzen und die Signatur wechselt bei jedem Lauf."
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>&1 | head -20 || true
          fi

      - name: Hinweis ohne Keystore-Secret
        if: env.DEBUG_KEYSTORE_B64 == ''
        run: echo "::warning::DEBUG_KEYSTORE_B64 ist nicht gesetzt - die APK wird mit einem neuen Zufallsschluessel signiert und muss vor der Installation deinstalliert werden."

      - name: Gates ausfuehren (Unit-Tests, Lint, Debug-APK)
        working-directory: android
        run: |
          unset LAYERMAXXING_GREGOR_URL LAYERMAXXING_GERFRIED_URL
          KS="$HOME/.android/debug.keystore"
          SIGN=""
          if [ -f "$KS" ]; then
            SIGN="-Pandroid.injected.signing.store.file=$KS"
            SIGN="$SIGN -Pandroid.injected.signing.store.password=android"
            SIGN="$SIGN -Pandroid.injected.signing.key.alias=androiddebugkey"
            SIGN="$SIGN -Pandroid.injected.signing.key.password=android"
            echo "Signiere explizit mit $KS"
          fi
          ./gradlew --no-daemon $SIGN testDebugUnitTest lintDebug assembleDebug

      - name: APK benennen
        id: apk
        run: |
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          TAG="${VERSION/.0-/-}"
          NAME="GS-Layermaxxing-Gerfried-v${TAG}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Signatur der APK pruefen
        run: |
          APK="dist/${{ steps.apk.outputs.name }}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "apksigner: $APKSIGNER"
          ls -l "$APK"
          echo "--- apksigner-Ausgabe ---"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/certs.txt 2>&1 || echo "(apksigner endete mit Fehler)"
          cat /tmp/certs.txt
          echo "--- Ende ---"
          ACTUAL="$(grep -oiE 'SHA-256 digest:[[:space:]]*[0-9a-f]{64}' /tmp/certs.txt | head -1 | grep -oiE '[0-9a-f]{64}' | tr '[:lower:]' '[:upper:]')"
          echo "APK signiert mit: ${ACTUAL:-nicht ermittelbar}"
          if [ -z "${EXPECTED_SIGNER:-}" ]; then
            echo "::warning::Kein Referenz-Fingerprint - Signatur kann je Lauf wechseln."
          elif [ -z "$ACTUAL" ]; then
            echo "::warning::Signatur der APK liess sich nicht auslesen (siehe Ausgabe oben)."
          elif [ "$ACTUAL" = "$EXPECTED_SIGNER" ]; then
            echo "Signatur stimmt mit DEBUG_KEYSTORE_B64 ueberein - Updates ohne Deinstallation moeglich."
          else
            echo "::warning::Signatur weicht vom hinterlegten Keystore ab (erwartet $EXPECTED_SIGNER, tatsaechlich $ACTUAL)."
          fi
          echo "Signatur: ${ACTUAL:-unbekannt} (Referenz ${EXPECTED_SIGNER:-keine})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gerfried-apk
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Lint- und Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerfried-reports
          path: android/app/build/reports/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Prerelease veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="gerfried-v${{ steps.apk.outputs.tag }}-b${{ github.run_number }}"
          NOTES="Automatischer Testbuild vom Branch gerfried.

          Commit: ${GITHUB_SHA}
          Gates: pytest (server/tests), testDebugUnitTest, lintDebug, assembleDebug
          applicationId: at.gregor.layermaxxing.gerfried (parallel installierbar)"
          gh release create "$RELEASE_TAG" "dist/${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GS Layermaxxing Gerfried ${{ steps.apk.outputs.version }} (Build ${{ github.run_number }})" \
            --prerelease \
            --notes "$NOTES"
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Latest-Release aktualisieren (feste Download-Adresse)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_NAME="GS-Layermaxxing-Gerfried-latest.apk"
          LATEST_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/gerfried-latest/${LATEST_NAME}"
          cp "dist/${{ steps.apk.outputs.name }}" "dist/${LATEST_NAME}"
          gh release delete gerfried-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          sleep 3
          NOTES="Immer der neueste Gerfried-Testbuild vom Branch gerfried.

          Version: ${{ steps.apk.outputs.version }} (Build ${{ github.run_number }})
          Commit: ${GITHUB_SHA}

          Feste Adresse fuers Handy (aendert sich nie):
          ${LATEST_URL}"
          gh release create gerfried-latest "dist/${LATEST_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Neuester Gerfried-Testbuild (${{ steps.apk.outputs.version }}, Build ${{ github.run_number }})" \
            --prerelease \
            --notes "$NOTES"
          {
            echo "APK direkt: ${LATEST_URL}"
            echo "Release-Seite: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/gerfried-latest"
          } >> "$GITHUB_STEP_SUMMARY"
